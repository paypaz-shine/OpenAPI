<body>
<main class="page">
<header class="header"><div class="brand">法币出金</div><button class="lang" id="language" type="button">EN</button></header>
<section id="entry" class="content">
 <form id="withdraw-form" novalidate>
  <div class="card"><label class="caption" for="amount" data-i="amount"></label><div class="amount-input"><input id="amount" name="amount" type="text" inputmode="numeric" value="10000" autocomplete="off" aria-describedby="amount-hint form-error"><span class="currency">CNY</span></div><p class="hint" id="amount-hint" data-i="range"></p></div>
  <div class="card" style="margin-top:14px"><span class="verified" data-i="verified"></span><h2 data-i="recipient"></h2>
   <label class="field"><span data-i="accountName"></span><input id="account-name" name="accountName" value="陈明" autocomplete="name" maxlength="100" aria-describedby="form-error"></label>
   <label class="field"><span data-i="cardNo"></span><input id="account-no" name="accountNo" value="6222 0000 0000 0000 123" inputmode="numeric" autocomplete="off" maxlength="40" aria-describedby="form-error"></label>
   <label class="field"><span data-i="bankName"></span><select id="bank-name" name="bankCode" required aria-describedby="form-error"></select></label><p class="hint" data-i="bankHint"></p>
  </div>
    <div class="card" style="margin-top:14px"><h2 data-i="identity"></h2><div class="row"><span class="key" data-i="kycName"></span><span class="value">陈明</span></div><div class="row"><span class="key" data-i="idType"></span><span class="value" data-i="idCard"></span></div><div class="row"><span class="key" data-i="idNo"></span><span class="value mono" id="id-number">110101199001011234</span></div></div>
  <div class="note" style="margin-top:14px" data-i="ownOnly"></div>
  <label class="check" style="margin:16px 0"><input type="checkbox" id="consent"><span data-i="consent"></span></label>
  <p class="error" id="form-error" role="alert"></p><button class="btn" type="submit" id="apply" data-i="apply" style="margin-top:12px" disabled></button>
 </form>
</section>
<section id="order" class="content" hidden>
 <div class="status-hero" aria-live="polite"><div class="status-icon" id="status-icon"></div><h2 id="status-title"></h2><div class="hero-amount"><span id="hero-amount"></span><small>CNY</small></div><div class="hero-deadline" id="deadline-row" hidden><span class="key" id="deadline-label"></span><span class="time-chip" id="countdown"></span></div><p id="status-desc"></p></div>
 <div class="card"><div class="steps" id="steps"></div><div class="row"><span class="key" data-i="orderNo"></span><span class="value mono"><span id="order-no"></span><button class="copy" id="copy-order" type="button" aria-label="复制"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></svg></button></span></div><div class="row"><span class="key" data-i="created"></span><span class="value mono" id="created-at"></span></div><div class="row" id="payment-time-row" hidden><span class="key" data-i="proofTime"></span><span class="value mono" id="payment-time"></span></div><div class="row" id="customer-confirmed-time-row" hidden><span class="key" data-i="customerConfirmedAt"></span><span class="value mono" id="customer-confirmed-time"></span></div><div class="row" id="confirmed-time-row" hidden><span class="key" data-i="confirmedAt"></span><span class="value mono" id="confirmed-time"></span></div><div class="row" id="failure-time-row" hidden><span class="key" data-i="failureTime"></span><span class="value mono" id="failure-time"></span></div><div class="row" id="failure-row" hidden><span class="key" data-i="reason"></span><span class="value" id="failure-reason"></span></div></div>
 <div class="card"><h2 data-i="recipient"></h2><div class="row"><span class="key" data-i="accountName"></span><span class="value" id="recipient-name"></span></div><div class="row"><span class="key" data-i="cardNo"></span><span class="value mono" id="recipient-no"></span></div><div class="row"><span class="key" data-i="bankName"></span><span class="value" id="recipient-bank"></span></div></div>

 <div class="note" id="order-note"></div>
 <div class="card" id="evidence-card" hidden><h2 data-i="evidenceTitle"></h2><p class="caption" data-i="evidenceRequest"></p><ul class="evidence-list" id="saved-evidence"></ul><button class="text-btn" id="supplement" type="button" data-i="supplement"></button></div>
 <div class="actions"><button class="btn" id="confirm-received" type="button" data-i="received"></button><button class="btn ghost" id="report-issue" type="button" data-i="issue"></button><button class="text-btn return-link" id="return" type="button" data-i="return"></button></div>
</section>
<section id="merchant-home" class="content" hidden><div class="card"><h2 data-i="merchantHome"></h2><p class="caption" data-i="merchantHomeHint"></p><p class="caption" style="font-size:11px;margin-top:4px">原型演示：实际为跳转商户传入的 returnUrl</p><div class="row"><span class="key" data-i="orderNo"></span><span class="value mono" id="home-order"></span></div><div class="row"><span class="key" data-i="withdraw"></span><span class="value" id="home-status"></span></div><button class="btn ghost" id="view-order" type="button" data-i="viewOrder" style="margin-top:14px"></button></div></section>
<section id="invalid" class="content" hidden><div class="status-hero" style="padding-top:65px"><div class="status-icon failed" id="invalid-icon"></div><h2 data-i="invalidTitle"></h2><p data-i="invalidDesc"></p></div></section>
</main>
<aside aria-label="原型演示控制台"><details class="demo" id="demo"><summary>Fiat PayOut · 原型演示</summary><div class="demo-body"><p>模拟 CFD 商户接入与客户出金流程。所有操作仅用于原型评审，不发起真实出金。</p><label for="scenario">下单响应</label><select id="scenario"><option value="success">受理成功</option><option value="timeout">响应超时（结果待查询）</option><option value="inflight">客户已有在途订单</option><option value="bank">银行编码不支持（BANK_NOT_SUPPORTED）</option><option value="unavailable">当前无可用出款通道（NO_AVAILABLE_CHANNEL）</option><option value="insufficientBalance">CFD 商户 USDT 余额不足（INSUFFICIENT_BALANCE）</option><option value="disabled">商户暂未开通代付</option></select><label for="return-url">下单是否传 returnUrl</label><select id="return-url"><option value="yes">是</option><option value="no">否</option></select><label>状态预览</label><div class="demo-buttons" id="preview-buttons"><button data-preview="entry">出金申请</button><button data-preview="pending_payment">待接单（出金处理中）</button><button data-preview="pending_payment_accepted">待付款（出金处理中）</button><button data-preview="payment_timeout_review">正在核实付款情况（无凭证）</button><button data-preview="pending_confirmation">待确认到账</button><button data-preview="confirm_timeout_review">正在核实出金结果（有凭证）</button><button data-preview="pending_merchant_confirmation">到账已确认，等待商户处理</button><button data-preview="appealed">到账问题核实中</button><button data-preview="completed">出金成功</button><button data-preview="failed">出金失败</button><button data-preview="invalid">无效链接（token 无效 / 过期）</button></div><div class="demo-divider"><label>推进当前订单</label><div class="demo-buttons"><button id="demo-accept">服务商接单</button><button id="demo-paid">收款服务商提交付款凭证</button><button id="demo-t1">付款截止到期（接单后 30 分钟）</button><button id="demo-provider-issue">服务商付款异常</button><button id="demo-provider-abnormal">服务商提交付款不正常（少付 / 处理中）</button><button id="demo-t2">到账确认超时</button><button id="demo-complete">商户确认到账</button><button id="demo-platform-complete">平台裁定成功</button><button id="demo-reject">服务商拒单</button><button id="demo-accept-timeout">接单超时（派单后 30 分钟未接单）</button><button id function transition(next,reason,eventOverride){if(!order||terminal())return notify('notAllowed');const from=order.status;const allowed={pending_payment:['pending_confirmation','payment_timeout_review','failed'],payment_timeout_review:['confirm_timeout_review','appealed','completed','failed'],pending_confirmation:['confirm_timeout_review','pending_merchant_confirmation','appealed','completed'],confirm_timeout_review:['pending_merchant_confirmation','appealed','completed','failed'],pending_merchant_confirmation:['completed','failed'],appealed:['completed','failed']};if(!allowed[from]?.includes(next))return notify('notAllowed');order.status=next;order.deadline=next==='pending_confirmation'?Date.now()+30*60000:null;const lateProof=from==='payment_timeout_review'&&next==='confirm_timeout_review';if(next==='pending_confirmation'||lateProof)order.proof=true;const eventKey=eventOverride||(lateProof?'lateProofEvent':({pending_confirmation:'paidEvent',payment_timeout_review:'paymentTimeoutEvent',confirm_timeout_review:'platformEvent',pending_merchant_confirmation:'feedbackEvent',appealed:'appealEvent',completed:'completedEvent',failed:'failedEvent'})[next]);if(next==='failed')order.failureReason=reason||(from==='appealed'?'rejectedAppeal':'rejected');if(eventKey)event(eventKey);persist();render();}

function acceptOrder(){if(!order||order.status!=='pending_payment'||order.acceptedAt)return notify('notAllowed');const now=Date.now();order.acceptedAt=now;order.paymentDeadlineAt=now+30*60000;order.deadline=Math.min(order.deadline,order.paymentDeadlineAt);event('providerAcceptedEvent');persist();render();}

// Preview controls are separate from the CFD user interface. Never call real payment APIs.
function preview(state){
 if(submitting)return;
 homeView=false;uncertainOrder=null;uncertain=false;
 document.querySelectorAll('dialog[open]').forEach(d=>d.close());
 if(state==='invalid'){
  order=null;params.set('status','invalid');
 }else{
  params.delete('status');
  const acceptedPreview=state==='pending_payment_accepted';if(acceptedPreview)state='pending_payment';
  if(state==='entry'){
   order=null;uncertain=false;pendingDraft=null;$('apply').textContent=t('apply');$('form-error').textContent='';
  }else{
   order=sampleOrder({amount:'10000',name:'陈明',card:'6222000000000000123',bank:'ICBC'});
   order.status=state;order.feedback=state==='pending_merchant_confirmation';
   order.proof=['pending_confirmation','confirm_timeout_review','pending_merchant_confirmation','appealed','completed'].includes(state);
   order.deadline=state==='pending_payment'?order.createdAt+60*60000:state==='pending_confirmation'?Date.now()+30*60000:null;
   const eventKey=({payment_timeout_review:'paymentTimeoutEvent',pending_confirmation:'paidEvent',confirm_timeout_review:'platformEvent',pending_merchant_confirmation:'feedbackEvent',appealed:'appealEvent',completed:'completedEvent',failed:'failedEvent'})[state];
   if(eventKey)event(eventKey);
   if(acceptedPreview){order.acceptedAt=order.createdAt;order.createdAt-=5*60000;order.acceptDeadlineAt=order.createdAt+30*60000;order.paymentDeadlineAt=order.acceptedAt+30*60000;order.deadline=Math.min(order.createdAt+60*60000,order.paymentDeadlineAt);order.events.push({key:'providerAcceptedEvent',at:order.acceptedAt});}
   if(state==='payment_timeout_review'){
    const previewTime=order.createdAt;order.createdAt=previewTime-45*60000;order.acceptDeadlineAt=order.createdAt+30*60000;order.acceptedAt=previewTime-40*60000;order.paymentDeadlineAt=order.acceptedAt+30*60000;
    const acceptedEvent=order.events.find(item=>item.key==='acceptedEvent');if(acceptedEvent)acceptedEvent.at=order.createdAt;
    const timeoutEvent=order.events.find(item=>item.key==='paymentTimeoutEvent');if(timeoutEvent)timeoutEvent.at=order.paymentDeadlineAt;
    order.events.push({key:'providerAcceptedEvent',at:order.acceptedAt});
   }
   if(['pending_confirmation','confirm_timeout_review','pending_merchant_confirmation','appealed','completed'].includes(state)){
    const previewTime=order.createdAt;order.createdAt=previewTime-10*60000;
    const acceptedEvent=order.events.find(item=>item.key==='acceptedEvent');if(acceptedEvent)acceptedEvent.at=order.createdAt;
    const paymentEvent=order.events.find(item=>['paidEvent','lateProofEvent'].includes(item.key));
    if(paymentEvent)paymentEvent.at=previewTime-5*60000;else order.events.push({key:'paidEvent',at:previewTime-5*60000});
    order.acceptedAt=previewTime-8*60000;order.acceptDeadlineAt=order.createdAt+30*60000;order.paymentDeadlineAt=order.acceptedAt+30*60000;order.events.push({key:'providerAcceptedEvent',at:order.acceptedAt});
    if(state==='pending_merchant_confirmation'){const confirmedEvent=order.events.find(item=>item.key==='feedbackEvent');if(confirmedEvent)confirmedEvent.at=previewTime-2*60000;}
    if(state==='completed'){const completedEvent=order.events.find(item=>item.key==='completedEvent');if(completedEvent)completedEvent.at=previewTime;}
   }
  }
 }
 persist();render();window.scrollTo({top:0,behavior:'instant'});
}
